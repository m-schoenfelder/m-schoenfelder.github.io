<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curani Care — Caregiver Invitation</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #1c1c1e; }
    p  { font-size: 15px; color: #6e6e73; line-height: 1.5; margin-bottom: 28px; }
    a.button {
      display: inline-block;
      background: #5B6EF5;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You've been invited to Curani Care</h1>
    <p>Download the free Curani Care app to follow your patient's medication schedule.</p>
    <a class="button" href="https://apps.apple.com/app/id6790899080">Download on the App Store</a>
  </div>
</body>
</html>
