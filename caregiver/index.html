<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curani Care — Caregiver Invitation</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #1c1c1e; }
    p  { font-size: 15px; color: #6e6e73; line-height: 1.5; margin-bottom: 24px; }
    a.button {
      display: block;
      background: #5B6EF5;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 12px;
    }
    a.secondary {
      background: transparent;
      color: #5B6EF5;
      box-shadow: inset 0 0 0 1.5px #5B6EF5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You've been invited to Curani Care</h1>
    <p>Curani Care lets you follow your patient's medication schedule. If you already have the app, open the invitation; otherwise download it free.</p>
    <a class="button" id="accept" style="display:none">Open in Curani Care</a>
    <a class="button secondary" id="download" href="https://apps.apple.com/app/id6790899080">Download Curani Care</a>
  </div>
  <script>
    // The QR wraps the raw iCloud CKShare URL as ?url=<encoded>. If present, expose an
    // "Open in Curani Care" action that hands the share straight to iOS — on a device with
    // Curani Care installed (CKSharingSupported), this triggers the native accept sheet and
    // routes to the app. Recipients without the app fall through to the download button.
    var shareURL = new URLSearchParams(window.location.search).get("url");
    if (shareURL) {
      var accept = document.getElementById("accept");
      accept.href = shareURL;
      accept.style.display = "block";
      var download = document.getElementById("download");
      download.classList.add("secondary");
    }
  </script>
</body>
</html>
