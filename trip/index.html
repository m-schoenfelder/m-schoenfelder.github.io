<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Planner — Trip Invitation</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #1c1c1e; }
    p  { font-size: 15px; color: #6e6e73; line-height: 1.5; margin-bottom: 24px; }
    a.button {
      display: block;
      background: #0A84FF;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 12px;
    }
    a.secondary {
      background: transparent;
      color: #0A84FF;
      box-shadow: inset 0 0 0 1.5px #0A84FF;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #000; }
      .card { background: #1c1c1e; }
      h1 { color: #fff; }
      p  { color: #98989d; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You've been invited to a trip</h1>
    <p>Trip Planner lets you follow a trip's destinations and itinerary. If you already
       have the app, open the invitation; otherwise download it free.</p>
    <a class="button" id="accept" style="display:none">Open in Trip Planner</a>
    <a class="button secondary" id="download"
       href="https://apps.apple.com/app/id0000000000">Download Trip Planner</a>
  </div>
  <script>
    // The QR wraps the raw iCloud CKShare URL as ?url=<encoded>. When it's present, expose
    // an "Open in Trip Planner" action pointing at that raw link — on a device with the app
    // installed (CKSharingSupported), iOS shows the native accept sheet and routes into the
    // app. Recipients without it fall through to the download button.
    var shareURL = new URLSearchParams(window.location.search).get("url");
    if (shareURL) {
      var accept = document.getElementById("accept");
      accept.href = shareURL;
      accept.style.display = "block";
      document.getElementById("download").classList.add("secondary");
    }
  </script>
</body>
</html>
